<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA STREETWEAR | ร้านค้าเสื้อผ้าแฟชั่นออนไลน์</title>
  <meta name="description" content="AURA STREETWEAR ร้านค้าเสื้อผ้าแฟชั่นแนวสตรีทระดับพรีเมียม">
  
  <!-- Google Fonts: Prompt & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== PART 1: TOP ANNOUNCEMENT BAR & HEADER ==================== -->
  
  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <div class="container announcement-content">
      <span>🔥 <strong>FLASH SALE:</strong> ส่วนลดสูงสุด 50% + จัดส่งฟรีเมื่อช้อปครบ ฿1,500 | โค้ด: <strong>AURA15</strong></span>
      <div class="announcement-right">
        <span><i class="fa-solid fa-truck-fast"></i> จัดส่งด่วนใน 1-2 วัน</span>
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i> <span class="theme-text">Dark Mode</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Header / Navigation Bar -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <!-- Mobile Menu Trigger -->
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open Menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Brand Logo -->
      <a href="#" class="brand-logo">
        <span class="logo-accent">AURA</span>
        <span class="logo-sub">STREETWEAR</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="navMenu">
        <a href="#hero" class="nav-link active">หน้าหลัก</a>
        <a href="#catalog" class="nav-link">สินค้าทั้งหมด</a>
        <a href="#featured" class="nav-link">คอลเลกชันใหม่</a>
        <a href="#flashsale" class="nav-link highlight">โปรโมชันพิเศษ</a>
        <a href="#about" class="nav-link">เกี่ยวกับเรา</a>
      </nav>

      <!-- Search & Cart Actions -->
      <div class="header-actions">
        <!-- Live Search Bar -->
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ค้นหาเสื้อผ้า, ไซส์, หมวดหมู่..." autocomplete="off">
          <button class="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Wishlist Icon -->
        <button class="action-btn" id="wishlistBtn" title="รายการที่ชอบ">
          <i class="fa-regular fa-heart"></i>
          <span class="badge" id="wishlistBadge">0</span>
        </button>

        <!-- Cart Icon Trigger -->
        <button class="action-btn cart-btn" id="cartBtn" title="ตะกร้าสินค้า">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge" id="cartBadge">0</span>
          <span class="cart-total-badge" id="cartHeaderTotal">฿0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="mainContent">
    <!-- ส่วนประกอบถัดไปจะถูกเพิ่มทีละส่วนที่นี่ -->
  </main>

  <!-- App Script -->
  <script src="script.js"></script>
</body>
</html>
